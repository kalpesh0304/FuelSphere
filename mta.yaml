_schema-version: "3.2"
ID: fuelsphere
version: 1.0.0
description: "FuelSphere - CAPM Backend for Airline Fuel Lifecycle Management"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:
  # ==================== APPLICATION ROUTER ====================
  - name: fuelsphere-approuter
    type: approuter.nodejs
    path: app
    parameters:
      buildpack: nodejs_buildpack
      memory: 1024M
      disk-quota: 2048M
    build-parameters:
      builder: custom
      commands:
        - npm install --production --ignore-scripts --no-audit --no-fund
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: fuelsphere-auth

  # ==================== SERVER MODULE ====================
  - name: fuelsphere-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 1024M
      disk-quota: 2048M
    properties:
      # ==================== S/4 FUEL POSTING ====================
      #
      # LIVE SINCE 19 Oct 2026, on instruction, and deliberately pinned here.
      #
      # IT IS PINNED BECAUSE A DEPLOY RESETS IT. `cf set-env` survives a
      # restage and does NOT survive an MTA deploy - the deploy rewrites the
      # application's environment from this file. Live testing was being
      # silently returned to mock by every deploy, which is the worst kind of
      # wrong: postings appeared to succeed and nothing reached S/4.
      #
      # WHAT CHANGED SINCE IT READ `mock`. Both blockers below have been
      # worked through:
      #
      #   1. The master data now matches S2A - contract 7000000033, material
      #      JETA1, plant 3COK - maintained through the mapping apps rather
      #      than the seed, and a real PO has been created in S2A against it.
      #   2. The invoice step is a SEPARATE action (InvoiceService), not part
      #      of ticket save, so the OMR6 tolerance-key gap no longer blocks
      #      uplift posting. It still blocks the invoice step itself.
      #
      # WHAT LIVE MEANS, PLAINLY: every fuel ticket save now makes a real call
      # to S2A and creates a real purchase order and goods receipt. A ticket
      # that fails records the error on itself and in the posting log rather
      # than throwing, so a bad master-data row is visible instead of silently
      # dropped - but the documents it does create are real and have to be
      # reversed in S/4, not deleted in FuelSphere.
      #
      # Use `off` to stop posting entirely; `mock` for a demo that must not
      # touch S2A.
      FS_S4_POSTING_MODE: live
    build-parameters:
      builder: custom
      commands:
        - npm install --production --ignore-scripts --no-audit --no-fund
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: fuelsphere-db
      - name: fuelsphere-auth
      - name: fuelsphere-destination
      - name: fuelsphere-logging
      - name: fuelsphere-connectivity   # S2A backend connectivity

  # ==================== DATABASE MODULE ====================
  - name: fuelsphere-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1024M
    requires:
      - name: fuelsphere-db

resources:
  # ==================== HDI CONTAINER ====================
  - name: fuelsphere-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # ==================== XSUAA ====================
  - name: fuelsphere-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: fuelsphere-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**

  # ==================== DESTINATION SERVICE ====================
  - name: fuelsphere-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: S4HC_TECHNICAL
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2ClientCredentials
                Description: S/4HANA Cloud Technical User
              - Name: S4HC_USER
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2SAMLBearerAssertion
                Description: S/4HANA Cloud Principal Propagation

  # ==================== APPLICATION LOGGING ====================
  - name: fuelsphere-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
  
  # ==================CONNECTIVITY SERVICE ==================
  - name: fuelsphere-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite