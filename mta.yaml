_schema-version: "3.2"
ID: fuelsphere
version: 1.0.0
description: "FuelSphere - CAPM Backend for Airline Fuel Lifecycle Management"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:
  # ==================== APPLICATION ROUTER ====================
  - name: fuelsphere-approuter
    type: approuter.nodejs
    path: app
    parameters:
      buildpack: nodejs_buildpack
      memory: 1024M
      disk-quota: 2048M
    build-parameters:
      builder: custom
      commands:
        - npm install --production --ignore-scripts --no-audit --no-fund
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: fuelsphere-auth

  # ==================== SERVER MODULE ====================
  - name: fuelsphere-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 1024M
      disk-quota: 2048M
    properties:
      # ==================== S/4 FUEL POSTING ====================
      #
      # mock ON PURPOSE, not an oversight. srv/lib/s4-fuel-posting.js defaults
      # to LIVE on the production profile, and live posting against S2A cannot
      # work yet for two independent reasons:
      #
      #   1. The master data does not match S2A. The seed carries contracts
      #      4600000001.., materials 10000001.., plants MNL1/DXB1.. and no COK
      #      airport at all; S2A needs 7000000033, JETA1 and 3COK.
      #   2. The invoice step is blocked anyway - company code 3000 has no
      #      invoice tolerance key PP (OMR6), so every invoice fails M8 215.
      #
      # Left on live, every ticket save would make a real call and write an
      # error onto the ticket. Set this to live once (1) is seeded and (2) is
      # configured; use off to stop posting entirely.
      FS_S4_POSTING_MODE: mock
    build-parameters:
      builder: custom
      commands:
        - npm install --production --ignore-scripts --no-audit --no-fund
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: fuelsphere-db
      - name: fuelsphere-auth
      - name: fuelsphere-destination
      - name: fuelsphere-logging
      - name: fuelsphere-connectivity   # S2A backend connectivity

  # ==================== DATABASE MODULE ====================
  - name: fuelsphere-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1024M
    requires:
      - name: fuelsphere-db

resources:
  # ==================== HDI CONTAINER ====================
  - name: fuelsphere-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # ==================== XSUAA ====================
  - name: fuelsphere-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: fuelsphere-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**

  # ==================== DESTINATION SERVICE ====================
  - name: fuelsphere-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: S4HC_TECHNICAL
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2ClientCredentials
                Description: S/4HANA Cloud Technical User
              - Name: S4HC_USER
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2SAMLBearerAssertion
                Description: S/4HANA Cloud Principal Propagation

  # ==================== APPLICATION LOGGING ====================
  - name: fuelsphere-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
  
  # ==================CONNECTIVITY SERVICE ==================
  - name: fuelsphere-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite